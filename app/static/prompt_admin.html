<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Prompt · Đông Hải AI</title>
    <link
      rel="stylesheet"
      href="/static/css/admin_sidebar.css?v=20260815-redesign2"
    />
    <link
      rel="stylesheet"
      href="/static/css/admin_pages.css?v=20260828-prompt-actions1"
    />
    <link rel="stylesheet" href="/static/css/chatbot.css?v=20260824-1" />
  </head>
  <body class="has-admin-sidebar">
    <aside class="admin-sidebar">
      <a class="admin-sidebar-brand" href="/admin/products"
        ><img src="/static/assets/logo.jpg" alt="Đông Hải" /><span
          >Đông Hải AI</span
        ></a
      >
      <nav>
        <a href="/admin/products"><span>◫</span>Sản phẩm</a
        ><a href="/admin/knowledge"><span>▤</span>Knowledge</a
        ><a class="active" href="/admin/prompts"><span>✎</span>Prompt</a
        ><a href="/admin/conversations"><span>☰</span>Hội thoại</a>
      </nav>
    </aside>
    <div class="admin-page">
      <header class="page-head">
        <h1>Quản lý Prompt</h1>
        <p>
          Chỉnh sửa file TXT, lưu phiên bản dự phòng và áp dụng ngay cho
          chatbot.
        </p>
      </header>
      <main class="page-content">
        <div class="grid-2">
          <aside class="card">
            <h2>Danh sách file</h2>
            <p class="muted">
              Chỉ các file trong danh sách an toàn mới được chỉnh sửa.
            </p>
            <div class="prompt-list" id="promptList"></div>
          </aside>
          <section class="card">
            <div class="editor-head">
              <div>
                <h2 id="promptTitle">Chọn một prompt</h2>
                <div class="file-pill" id="promptMeta"></div>
              </div>
              <div class="actions prompt-editor-actions">
                <span class="editor-count" id="editorCount"></span
                ><span class="save-state" id="saveState">Chưa chọn file</span
                ><button id="reloadPrompt" type="button" disabled>
                  Tải lại
                </button
                ><button id="savePrompt" type="button" disabled>
                  Lưu và áp dụng
                </button>
              </div>
            </div>
            <textarea
              id="promptEditor"
              disabled
              spellcheck="false"
              placeholder="Chọn file bên trái để chỉnh sửa"
            ></textarea>
            <div class="notice" id="promptNotice"></div>
          </section>
        </div>
      </main>
    </div>
    <script src="/static/js/admin_base.js?v=20260824-1"></script>
    <script
      src="/static/js/prompt_admin.js?v=20260826-promptfont1"
      defer
    ></script>
  </body>
</html>
